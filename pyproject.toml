[project]
name = "pisa-py"
version = "0.1.0"
description = "Analysis of disengaged and inconsistent responding in the PISA 2022 student survey"
requires-python = ">=3.11"
dependencies = [
    "polars",
    "pandas",
    "pyarrow",   # required by polars' .to_pandas()
    "plotnine",  # pulls in matplotlib
    "pyreadstat", # reading SPSS .SAV files
]

[project.optional-dependencies]
dev = [
    "ipykernel",
    "mypy",
    "pytest",
    "ruff",
]

[project.scripts]
make-subset = "pisa_py.io:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# target-version is inferred from project.requires-python
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.mypy]
strict = true
warn_unreachable = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
